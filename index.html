const app=document.querySelector('#app'),logout=document.querySelector('#logout');let logged=sessionStorage.getItem('studyLogin2027')==='1', unit=0, activity='';const units=[{name:'秦漢',period:'統一帝國的建立與發展',term:'郡縣制',question:'秦統一後，在地方推行甚麼制度？',options:['郡縣制','行省制','三省六部制'],answer:0,pairs:[['秦始皇','統一六國'],['漢武帝','推行推恩令']]},{name:'魏晉南北朝',period:'分裂、交流與民族融合',term:'淝水之戰',question:'淝水之戰發生於甚麼時期？',options:['秦朝','東晉','唐朝'],answer:1,pairs:[['東晉','淝水之戰'],['北魏','孝文帝改革']]},{name:'隋唐',period:'盛世氣象與制度演變',term:'科舉制',question:'哪一項制度以考試選拔官員？',options:['科舉制','分封制','世襲制'],answer:0,pairs:[['隋朝','開通大運河'],['唐朝','貞觀之治']]},{name:'清',period:'統治政策與近代轉變',term:'康乾盛世',question:'清代前期的盛世通常稱為甚麼？',options:['文景之治','康乾盛世','開元盛世'],answer:1,pairs:[['康熙帝','平定三藩'],['乾隆帝','清代前期皇帝']]}];function set(html){app.innerHTML=html;logout.classList.toggle('hidden',!logged);window.scrollTo(0,0)}function login(){set(`<div class="login"><div class="login-form"><form class="formbox" id="form"><span class="kicker">WELCOME BACK</span><h2>你今日溫咗未？</h2><p class="sub">輸入你的登入密碼，開始今天的溫習。</p><label class="field" for="code">登入密碼</label><input id="code" type="password" placeholder="請輸入登入密碼" required autocomplete="off"><button class="primary wide">進入溫書平台</button><p class="hint" id="login-error" role="alert"></p></form></div></div>`);document.querySelector('#form').onsubmit=e=>{e.preventDefault();if(document.querySelector('#code').value.trim()==='dse2027'){logged=true;sessionStorage.setItem('studyLogin2027','1');home()}else{document.querySelector('#login-error').textContent='登入密碼不正確，請再試一次。'}}}function clock(){let diff=Math.max(0,new Date('2027-04-24T00:00:00+08:00')-Date.now());let vals=[Math.floor(diff/86400000),Math.floor(diff/3600000)%24,Math.floor(diff/60000)%60,Math.floor(diff/1000)%60];document.querySelectorAll('[data-clock]').forEach((el,i)=>el.textContent=String(vals[i]).padStart(2,'0'))}function home(){set(`<main class="shell main"><section class="countdown"><div><div class="eyebrow">QUEST COUNTDOWN</div><h2>距離 2027 DSE 還有</h2><p>2027 年 4 月 24 日 · 每一天的努力都算數</p></div><div class="clock">${['日','時','分','秒'].map(x=>`<div><strong data-clock>00</strong><span>${x}</span></div>`).join('')}</div></section><div class="intro"><div><span class="kicker">CHOOSE YOUR QUEST</span><h1>你的溫習旅程</h1></div></div><div class="section-label">選擇關卡</div><div class="cards"><button class="card" id="parta"><div class="cardhead"><span class="icon portrait"><span class="sprite qin" role="img" aria-label="像素風秦始皇"></span></span><span class="badge">4 個單元</span></div><h3>必修甲部</h3><p>按朝代梳理重要課題，鞏固中史基礎。</p></button><button class="card" disabled><div class="cardhead"><span class="icon portrait"><span class="sprite sun" role="img" aria-label="像素風孫中山"></span></span><span class="badge muted">稍後推出</span></div><h3>必修乙部</h3><p>內容準備中，敬請期待。</p></button><button class="card" disabled><div class="cardhead"><span class="icon portrait"><span class="sprite wu" role="img" aria-label="像素風武則天"></span></span><span class="badge muted">稍後推出</span></div><h3>選修單元六：婦女史</h3><p>內容準備中，敬請期待。</p></button></div><div class="footer-note">把每一段歷史，讀成自己的知識。</div></main>`);document.querySelector('#parta').onclick=showUnits;clock()}function showUnits(){set(`<main class="shell main"><button class="back" id="back">〈 返回課程總覽</button><div class="page-head"><span class="kicker">COMPULSORY PART A</span><h1>必修甲部</h1><p>選擇一個朝代，開始你的溫習。</p></div><div class="section-label">選擇朝代關卡</div><div class="cards">${units.map((u,i)=>`<button class="card unit-card" data-unit="${i}" ${i===3?"disabled aria-disabled=\"true\"":""}><div class="cardhead"><span class="unit-number">單元 0${i+1}</span><span class="badge ${i===3?"muted":""}">${i===3?"稍後推出":"進入關卡"}</span></div><h3>${u.name}</h3><p>${u.period}</p></button>`).join('')}</div></main>`);document.querySelector('#back').onclick=home;document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{unit=+b.dataset.unit;showUnit()})}function showUnit(){let u=units[unit];set(`<main class="shell main"><button class="back" id="back">〈 返回必修甲部</button><div class="page-head"><span class="kicker">必修甲部 / 單元 0${unit+1}</span><h1>${u.name}</h1><p>${u.period} · 選擇一種方式開始練習</p></div><div class="section-label">選擇挑戰模式</div><div class="cards">${[['默','默書溫習','寫下你記得的重點，然後對照提示。'],['選','MC 挑戰','用選擇題測試你的基本概念。'],['配','配對挑戰','將歷史人物、事件與關鍵概念連起來。'],['卷','歷屆試題','按年份閱讀歷屆試題及資料。']].map((a,i)=>(unit===3 && i===0)||(i===2 && unit!==2)?'':`<button class="card" data-act="${i}"><div class="cardhead"><span class="icon">${a[0]}</span><span class="badge">${i===0 && unit===0?"8 個關卡":i===0 && unit===1?"2 個課題":i===0 && unit===2?"3 個課題":i===1 && unit<=2?"2 個練習":i===3 && unit===0?"7 組題目":i===3?"待補充":i===2 && unit===2?"拖曳配對":"示範練習"}</span></div><h3>${a[1]}</h3><p>${a[2]}</p></button>`).join('')}</div></main>`);document.querySelector('#back').onclick=showUnits;document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{activity=+b.dataset.act;showActivity()})}function showActivity(){if(activity===2 && unit===2){matchStart();return}if(activity===3){pastList();return}if(activity===1 && unit<=2){mcChooseTopic();return}if(activity===0 && unit===0){qinSummary();return}if(activity===0 && (unit===1 || unit===2)){lessonChoice();return}let u=units[unit],names=['默書溫習','MC 挑戰','配對挑戰'];let body=activity===0?`<h3>重點默書</h3><p class="sub">試寫出你對「${u.term}」的認識，再打開提示作自我檢查。</p><textarea rows="6" placeholder="在這裏寫下你記得的內容…"></textarea><p><button class="primary" id="reveal">查看提示</button></p><div id="result" class="flash hidden">溫習提示：回顧「${u.term}」的背景、內容和影響，並對照課堂筆記補充。</div>`:activity===1?`<h3>${u.question}</h3><p class="sub">選擇一個答案。</p>${u.options.map((x,i)=>`<button class="option" data-choice="${i}">${String.fromCharCode(65+i)}　${x}</button>`).join('')}<div id="result" class="feedback" aria-live="polite"></div>`:`<h3>配對歷史重點</h3><p class="sub">為每一項選擇對應的答案。</p>${u.pairs.map((p,i)=>`<label class="field">${p[0]}</label><select data-pair="${i}" style="width:100%;padding:14px;border:1px solid #d8e1da;border-radius:9px;background:white;font-size:16px"><option value="">請選擇</option>${[...u.pairs].reverse().map(q=>`<option value="${q[1]}">${q[1]}</option>`).join('')}</select>`).join('')}<p><button class="primary" id="check">檢查答案</button></p><div id="result" class="feedback" aria-live="polite"></div>`;set(`<main class="shell main"><div class="practice"><button class="back" id="back">〈 返回 ${u.name}</button><div class="page-head"><span class="kicker">${u.name} / 示範練習</span><h1>${names[activity]}</h1><p>先試一題，慢慢建立溫習節奏。</p></div><div class="panel">${body}</div><p class="hint">以上為示範內容，可按課程需要擴充題庫。</p></div></main>`);document.querySelector('#back').onclick=showUnit;if(activity===0)document.querySelector('#reveal').onclick=()=>document.querySelector('#result').classList.toggle('hidden');if(activity===1)document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>document.querySelector('#result').textContent=+b.dataset.choice===u.answer?'答對了！繼續保持。':'再想一想，試試另一個答案。');if(activity===2)document.querySelector('#check').onclick=()=>{let s=[...document.querySelectorAll('[data-pair]')];document.querySelector('#result').textContent=s.some(x=>!x.value)?'請先完成所有配對。':s.every((x,i)=>x.value===u.pairs[i][1])?'全部配對正確！':'有配對未正確，再試一次。'}}logout.onclick=()=>{sessionStorage.removeItem('studyLogin2027');logged=false;login()};logged?home():login();setInterval(()=>{if(document.querySelector('[data-clock]'))clock()},1000);
</script></body></html>
